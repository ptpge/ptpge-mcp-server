[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptpge-mcp-server"
version = "0.8.1"
description = "PTPGE Standard — Model Context Protocol server. Eksponerer PTPGE-vokabularet (Layer 1) for AI-agenter via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "PTPGE AS", email = "api@ptpge.org" },
]
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "a2wsgi>=1.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptpge_mcp*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

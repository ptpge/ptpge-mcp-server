# Signed releases — SECURITY.md §1.
# On a tag v<version>: build sdist + wheel, sign them with Sigstore (keyless, bound to this repo and tag),
# and attach artefacts + signatures to a GitHub Release. Verify with:
#   sigstore verify github --cert-identity-regexp 'github.com/ptpge/ptpge-mcp-server' ptpge_mcp_server-<v>-py3-none-any.whl
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write      # create the release
  id-token: write      # Sigstore keyless signing
jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - name: Build
        run: python -m pip install -q build && python -m build
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body: |
            PTPGE MCP server ${{ github.ref_name }}. Artefacts are signed with Sigstore (`.sigstore.json` bundles);
            see SECURITY.md §1 for how to verify. Changes: CHANGELOG.md.
